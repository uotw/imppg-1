name: Check upstream for new release

# Polls GreatAttractor/imppg daily for new version tags. If a tag is found that
# we have not yet built (no v<tag>-macos-* release exists on this fork), the
# workflow rebases fork master onto the new upstream tag (keeping our pipeline
# commits on top) and triggers release-macos.yml to produce the macOS build.

on:
  schedule:
    - cron: '17 9 * * *'  # daily at 09:17 UTC, offset to avoid hour-aligned runs
  workflow_dispatch:

permissions:
  contents: write   # rebase + push fork master
  actions:  write   # trigger release-macos.yml
  issues:   write   # open issue on failure

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/GreatAttractor/imppg.git
          git fetch upstream --tags

      - name: Find latest upstream version tag
        id: detect
        run: |
          LATEST=$(git tag -l 'v*' --merged upstream/master \
                   | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                   | sort -V | tail -1)
          if [[ -z "$LATEST" ]]; then
            echo "No upstream version tag found; nothing to do."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest upstream version tag: $LATEST"
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Check whether we have already built this tag
        if: steps.detect.outputs.tag != ''
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ steps.detect.outputs.tag }}'
          # --repo is explicit because we added the upstream remote earlier,
          # which confuses gh's auto-repo-resolution.
          if gh release list --repo "${{ github.repository }}" \
                --limit 100 --json tagName --jq '.[].tagName' \
              | grep -qE "^${TAG}-macos-"; then
            echo "Already built ${TAG} — nothing to do."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream tag ${TAG} not yet built; will rebase + trigger."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase fork master onto upstream tag
        if: steps.check.outputs.needs_build == 'true'
        run: |
          git rebase '${{ steps.detect.outputs.tag }}' master
          git push --force-with-lease origin master

      - name: Trigger release-macos.yml
        if: steps.check.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-macos.yml --repo "${{ github.repository }}"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Upstream check failed: run #${context.runNumber}`,
                body: [
                  `The scheduled upstream-tag check workflow failed.`,
                  `Run: ${runUrl}`,
                  ``,
                  `Likely causes:`,
                  `- Rebase conflict (a new upstream commit touched files our pipeline commits also touch)`,
                  `- Push rejected (GITHUB_TOKEN may lack permission if pipeline commit modifies workflow files; switch to a PAT in repo secrets)`,
                  `- Upstream repo unreachable or restructured`,
                ].join('\n'),
              });
            } catch (e) {
              // Issues may be disabled on the fork; don't fail the workflow over it.
              core.warning(`Could not open failure issue: ${e.message}`);
              core.warning(`Workflow failed; see ${runUrl}`);
            }
