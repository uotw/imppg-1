name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional suffix for release tag (e.g. "rc1"). Leave blank for default.'
        required: false
        default: ''

permissions:
  contents: write  # required to create a release
  issues:  write   # required to open an issue on failure

jobs:
  build:
    runs-on: macos-14  # Apple Silicon
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install --formula \
            boost cfitsio freeimage glew mesa pkg-config wxwidgets lua dylibbundler

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password:    ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Store notarytool credentials in keychain
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID:  ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "imppg-notary" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id  "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build, sign, notarize
        env:
          IMPPG_SIGN_IDENTITY:  ${{ secrets.MACOS_SIGN_IDENTITY }}
          IMPPG_NOTARY_PROFILE: imppg-notary
        run: ./scripts/macos/build-bundle.sh

      - name: Read version from CMakeLists.txt
        id: version
        run: |
          MAJ=$(awk '/^set\(IMPPG_VERSION_MAJOR /    {gsub(/[^0-9]/,"",$2); print $2}' CMakeLists.txt)
          MIN=$(awk '/^set\(IMPPG_VERSION_MINOR /    {gsub(/[^0-9]/,"",$2); print $2}' CMakeLists.txt)
          PAT=$(awk '/^set\(IMPPG_VERSION_SUBMINOR / {gsub(/[^0-9]/,"",$2); print $2}' CMakeLists.txt)
          echo "version=${MAJ}.${MIN}.${PAT}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}-macos-build-${{ github.run_number }}${{ github.event.inputs.tag_suffix && format('-{0}', github.event.inputs.tag_suffix) || '' }}"
          name: "ImPPG ${{ steps.version.outputs.version }} for macOS (build ${{ github.run_number }})"
          draft: true
          generate_release_notes: false
          body: |
            Self-contained macOS (Apple Silicon) build of ImPPG ${{ steps.version.outputs.version }}.

            Drag `ImPPG.app` from the DMG to `/Applications`. No Homebrew install needed on the target Mac — all dependencies are bundled, the app is code-signed with a Developer ID, and notarized by Apple.

            ---
            - Source: ${{ github.sha }}
            - Triggered by: @${{ github.actor }}
          files: |
            dist/ImPPG-*.dmg

      - name: Open issue on build failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `macOS build failed: run #${context.runNumber}`,
                body: [
                  `Workflow: \`${context.workflow}\``,
                  `Run: ${runUrl}`,
                  `Commit: ${context.sha}`,
                  `Triggered by: @${context.actor}`,
                  '',
                  'Common causes:',
                  '- Notarization rejection (see `==> Notarizing` lines in the log; `notarytool log` output is dumped on failure)',
                  '- Apple developer agreement expired (re-accept at https://developer.apple.com/account)',
                  '- Upstream build/CMake change that broke the script',
                  '- Homebrew dependency major version bump',
                ].join('\n'),
              });
            } catch (e) {
              // Issues may be disabled on the fork; don't fail the workflow over it.
              core.warning(`Could not open failure issue: ${e.message}`);
              core.warning(`Workflow failed; see ${runUrl}`);
            }
